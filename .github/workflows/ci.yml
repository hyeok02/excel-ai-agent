name: CI

on:
  push:
    branches: [main]
  pull_request:

# 같은 브랜치에 연달아 푸시하면 앞선 실행을 취소해, 마지막 커밋 결과를 빨리 본다.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ai:
    name: AI
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: AI
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          # 세 잡 모두 deploy/ 의 배포 이미지와 같은 런타임 버전으로 맞춘다.
          # CI 는 통과하는데 배포가 깨지는 상황을 만들지 않기 위해서다.
          python-version: '3.14'
          cache: pip
          cache-dependency-path: AI/pyproject.toml
      - run: pip install -e '.[dev]'
      - run: pytest

  backend:
    name: BE
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: BE
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v6
      - run: ./gradlew build

  frontend:
    name: FE
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: FE
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: FE/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run lint
      - run: npm run format:check
      - run: npm run build
