[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "excel-ai-agent-service"
version = "0.1.0"
description = "Python AI service for Excel workbook analysis"
requires-python = ">=3.12,<3.15"
dependencies = [
  "defusedxml>=0.7,<1.0",
  "fastapi[standard]>=0.135,<1.0",
  "langchain-openai>=1.1,<2.0",
  "openpyxl>=3.1,<4.0",
  "python-dotenv>=1.0,<2.0",
]

[project.optional-dependencies]
dev = [
  "httpx2>=2.0,<3.0",
  "pytest>=8.0,<10.0",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
