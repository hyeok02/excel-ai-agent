spring:
  datasource:
    url: jdbc:h2:mem:excel-ai-agent-test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
    username: sa
    password:
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration/h2

app:
  analysis:
    async-enabled: false
  storage:
    upload-dir: build/test-uploads
    cleanup-initial-delay: 24h
